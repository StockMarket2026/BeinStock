<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be In Stock - اشترك الآن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: linear-gradient(145deg, #0b1a33, #1a3a5c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #fff;
        }

        .subtitle {
            font-size: 17px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .highlight {
            color: #ffd966;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .form-group input, .form-group select {
            padding: 18px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            outline: none;
            transition: 0.3s;
            text-align: right;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: left 20px center;
            background-size: 16px;
        }

        .form-group select option {
            background: #1a3a5c;
            color: white;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group input:focus, .form-group select:focus {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .form-group button {
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            background: #ffd966;
            color: #0b1a33;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.25);
        }

        .form-group button:hover {
            transform: scale(1.03);
            background: #ffe68f;
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.4);
        }

        .footer {
            margin-top: 35px;
            font-size: 14px;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* ✅ تنسيق رابط "من نحن" في الأسفل */
        .about-link {
            display: block;
            margin-top: 20px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .about-link:hover {
            color: #ffd966;
        }

        /* ✅ تنسيق سطر التطوير (بالانجليزية) */
        .developer-credit {
            margin-top: 8px;
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 0.5px;
            color: #ccc;
            direction: ltr;
        }

        #msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 30px;
            background: rgba(0, 255, 0, 0.12);
            display: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 28px; }
            .logo-container img { max-width: 140px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://i.postimg.cc/5XDLCRCC/tsmym-bdwn-nwan.png" alt="Be In Stock Logo">
    </div>

    <h1>Be In Stock</h1>
    <p class="subtitle">
        <span class="highlight">تحليلات، توصيات، إدارة محافظ</span><br>
        كل ما تحتاجه للنجاح في سوق الأسهم السعودي و الأمريكي
    </p>

    <form id="leadForm" class="form-group">
        <input type="text" id="userName" placeholder="الإسم كاملاً" required>
        <input type="tel" id="userPhone" placeholder="رقم الجوال" required>
        
        <select id="userMarket" required>
            <option value="" disabled selected>ما هو السوق الذي يهمك؟</option>
            <option value="سعودي">🇸🇦 سوق الأسهم السعودي</option>
            <option value="أمريكي">🇺🇸 سوق الأسهم الأمريكي</option>
            <option value="كليهما">🌍 كليهما</option>
        </select>

        <button type="submit">🚀 احصل على توصية مجانية</button>
    </form>

    <p id="msg">✅ تم استلام طلبك بنجاح! سنتواصل معك قريباً.</p>

    <!-- ✅ رابط "من نحن" في الأسفل -->
    <a href="about.html" class="about-link">🏢 من نحن</a>

    <!-- ✅ الفوتر الرئيسي -->
    <div class="footer">© 2026 Be In Stock. جميع الحقوق محفوظة</div>

    <!-- ✅ سطر التطوير بالانجليزية (تحت الفوتر) -->
    <div class="developer-credit">Designed and Developed by Shady Taha</div>
</div>

<script>
    document.getElementById('leadForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var name = document.getElementById('userName').value;
        var phone = document.getElementById('userPhone').value;
        var market = document.getElementById('userMarket').value;
        var msgDiv = document.getElementById('msg');

        msgDiv.style.display = 'block';
        msgDiv.style.color = '#fff';
        msgDiv.innerText = 'جاري الإرسال...';

        var scriptURL = 'https://script.google.com/macros/s/AKfycbwAEIzQu1X3Y_4JzTCPBih8bZT6PgD4SqIUcPA-Rt1DKbnw6ZQ3WXVJQzhHvtdv0SKA7g/exec';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, phone: phone, market: market })
        })
        .then(() => {
            msgDiv.style.display = 'block';
            msgDiv.style.color = '#d4edda';
            msgDiv.innerText = '✅ تم استلام طلبك بنجاح! سنتواصل معك قريباً.';
            document.getElementById('leadForm').reset();
        })
        .catch(error => {
            msgDiv.style.display = 'block';
            msgDiv.style.color = '#f8d7da';
            msgDiv.innerText = '❌ حصل خطأ، حاول مرة أخرى.';
            console.error('Error!', error.message);
        });
    });
</script>

</body>
</html>
